name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Check frontend types
        working-directory: web
        run: npm run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: check-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Build desktop app
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin CasualtiesUnknown-SkinEditor

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-CasualtiesUnknown-SkinEditor
          path: src-tauri/target/release/CasualtiesUnknown-SkinEditor.exe
          if-no-files-found: error
