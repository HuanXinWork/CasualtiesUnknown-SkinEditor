name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            artifact: windows-x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            artifact: windows-arm64
            target: aarch64-pc-windows-msvc
            ext: .exe
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
            ext: ''
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            ext: ''
          - runner: macos-13
            platform: macos
            arch: x64
            artifact: macos-x64
            target: x86_64-apple-darwin
            ext: ''
          - runner: macos-14
            platform: macos
            arch: arm64
            artifact: macos-arm64
            target: aarch64-apple-darwin
            ext: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web bundle
        working-directory: web
        run: npm run build

      - name: Build Rust release binary
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} --bin CasualtiesUnknown-SkinEditor

      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail
          STAGE="stage-${{ matrix.artifact }}"
          mkdir -p "${STAGE}"
          cp "src-tauri/target/${{ matrix.target }}/release/CasualtiesUnknown-SkinEditor${{ matrix.ext }}" "${STAGE}/CasualtiesUnknown-SkinEditor${{ matrix.ext }}"
          for file in README.md README.en.md changes.md changes.en.md; do
            if [ -f "$file" ]; then
              cp "$file" "${STAGE}/"
            fi
          done
          if [ "${{ matrix.platform }}" != "windows" ]; then
            chmod +x "${STAGE}/CasualtiesUnknown-SkinEditor${{ matrix.ext }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasualtiesUnknown-SkinEditor-${{ matrix.artifact }}
          path: stage-${{ matrix.artifact }}/**
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CasualtiesUnknown-SkinEditor-*
          path: release-assets

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-bundles
          for dir in release-assets/CasualtiesUnknown-SkinEditor-*; do
            asset_name="$(basename "$dir")"
            archive_path="release-bundles/${asset_name}.zip"
            (
              cd release-assets
              zip -r "../${archive_path}" "${asset_name}"
            )
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundles/*.zip
          generate_release_notes: true
          overwrite_files: true
          prerelease: true